name: Jev PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip PRs from forks: GITHUB_TOKEN is read-only and the TYPESAFE_API_KEY
    # secret isn't exposed to fork PRs on a plain `pull_request` trigger.
    # (Deliberately not using `pull_request_target`, which runs the PR's own
    # code with base-repo secrets/permissions — a known privilege-escalation
    # risk for untrusted PRs.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run Jev review
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --import tsx scripts/review-pr.ts
